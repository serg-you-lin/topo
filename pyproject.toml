[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "g-topo"
# The one source of the version: topo.__version__ reads it from here through
# importlib.metadata; never repeat it in the code.
version = "0.40.23"
description = "Deterministic 2D geometry engine: it repairs vector geometry and reads its structure"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "All rights reserved" }
authors = [
    { name = "Federico Sidraschi" }
]
keywords = ["cad", "geometry", "technical-drawing", "dxf"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3",
]
# topo has no file format: ezdxf and PyMuPDF belong to the adapters, sibling
# packages in the same distribution, each with its own extra
dependencies = [
    "shapely>=2.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
dxf    = ["ezdxf>=1.1"]                 # topo_dxf
pdf    = ["PyMuPDF"]                    # topo_pdf
raster = ["opencv-python", "Pillow"]
# the tests read the DXF fixtures through topo_dxf
# pytest-timeout: every test has a ceiling; one that hangs fails with its name
dev    = ["pytest", "pytest-cov", "pytest-timeout", "ezdxf>=1.1"]
all    = ["g-topo[dxf,pdf,raster]"]

[tool.setuptools.packages.find]
where = ["."]
include = ["topo*"]

# Dependency rule checked by scripts/gen_index.py
[tool.gen_index.layers]
core  = ["tools", "io"]
model = ["tools", "io"]
# topo does not know the adapters exist and reads no format
topo = ["ezdxf", "fitz", "pymupdf", "topo_dxf", "topo_pdf"]
# An adapter is a consumer: topo's public names only, and it does not know
# the other adapters
topo_dxf = ["topo.core", "topo.tools", "topo.io", "topo.rules", "topo_pdf"]
topo_pdf = ["topo.core", "topo.tools", "topo.io", "topo.rules", "topo_dxf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# serial: the suite is meant to stay under 3 minutes even on a machine with few cores
addopts = "--timeout=60 --durations=8"