[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "g-topo"
# Unica fonte di verità della versione. topo.__version__ la legge da qui via
# importlib.metadata — non duplicarla nel codice (MAP.md D11).
version = "0.24.0"
description = "Deterministic 2D-geometry engine for technical drawings"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "All rights reserved" }
authors = [
    { name = "Federico Sidraschi" }
]
keywords = ["cad", "geometry", "technical-drawing", "dxf"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3",
]
# topo non ha un formato (MAP.md D123): ezdxf e PyMuPDF sono degli adapter,
# pacchetti fratelli nella stessa distribuzione, ognuno col suo extra (D124)
dependencies = [
    "shapely>=2.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
dxf    = ["ezdxf>=1.1"]                 # topo_dxf
pdf    = ["PyMuPDF"]                    # topo_pdf
raster = ["opencv-python", "Pillow"]
# i test leggono le fixture DXF attraverso topo_dxf
# pytest-timeout: ogni test ha un tetto, uno che si pianta fallisce col suo nome (D160)
dev    = ["pytest", "pytest-cov", "pytest-timeout", "ezdxf>=1.1"]
all    = ["g-topo[dxf,pdf,raster]"]

[tool.setuptools.packages.find]
where = ["."]
include = ["topo*"]

# Regola di dipendenza controllata da scripts/gen_index.py (MAP.md D44)
[tool.gen_index.layers]
core  = ["tools", "io"]
model = ["tools", "io"]
# topo non sa che gli adapter esistono e non legge alcun formato (D123, D129)
topo = ["ezdxf", "fitz", "pymupdf", "topo_dxf", "topo_pdf"]
# Un adapter è un consumer: solo i nomi pubblici di topo (D125), e non
# conosce gli altri adapter
topo_dxf = ["topo.core", "topo.tools", "topo.io", "topo.rules", "topo_pdf"]
topo_pdf = ["topo.core", "topo.tools", "topo.io", "topo.rules", "topo_dxf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# in seriale: la suite sta sotto i 3 minuti anche su una macchina con pochi core (D160)
addopts = "--timeout=60 --durations=8"